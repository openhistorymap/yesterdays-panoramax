name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pipx run ruff check .
      - run: pipx run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 4.2 is the oldest LTS we support, and it does not run on 3.13+.
        include:
          - { python: "3.11", django: "4.2" }
          - { python: "3.12", django: "4.2" }
          - { python: "3.12", django: "5.2" }
          - { python: "3.13", django: "5.2" }
          - { python: "3.13", django: "6.1" }
          - { python: "3.14", django: "6.1" }

    services:
      # The adapter aggregates extents, filters with spatial lookups and builds
      # vector tiles with ST_AsMVT, so the suite needs real PostGIS -- SQLite
      # and plain Postgres both fail at the first query.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: panoramax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install GeoDjango system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libproj-dev gdal-bin libgdal-dev

      - name: Install the package
        run: python -m pip install --upgrade pip && pip install -e ".[test]"

      - name: Pin Django ${{ matrix.django }}
        # After the editable install, so the matrix version wins over whatever
        # the dependency resolver picked.
        run: pip install "django~=${{ matrix.django }}.0"

      - name: Report the versions actually under test
        run: python -c "import django, sys; print(sys.version); print(django.get_version())"

      - name: Run the suite
        run: python -m django test tests --verbosity 2
        env:
          DJANGO_SETTINGS_MODULE: tests.settings
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: panoramax_test
