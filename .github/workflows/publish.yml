name: Publish

# Releasing is documented in docs/releasing.md. In short: bump the version in
# pyproject.toml, update CHANGELOG.md, then publish a GitHub Release whose tag
# is `v<version>`.
#
# A GitHub Release is the only trigger, deliberately. A manual dispatch would
# publish whatever version happened to be in pyproject.toml on whatever branch
# it was run from, and would bypass the tag-vs-version check below, which only
# has a tag to check against on a release. PyPI never lets a version number be
# reused, so that mistake is not recoverable. To retry a release whose publish
# failed for some transient reason, re-run the failed run itself
# (`gh run rerun <id> --failed`): it replays as the same release event, guard
# and all.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: pipx run build

      - name: Check the metadata renders on PyPI
        run: pipx run twine check --strict dist/*

      - name: Refuse a release whose tag disagrees with the version
        # A mismatch here means the tag, the changelog and the artefact would
        # all disagree, and PyPI will not let the version be reused once it is
        # taken. Cheaper to fail now.
        run: |
          version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::pyproject version ($version) does not match release tag ($tag)"
            exit 1
          fi
          echo "version $version matches tag $tag"

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/yesterdays-panoramax
    permissions:
      # Trusted Publishing: the OIDC token replaces a long-lived API token, so
      # no PyPI credential is ever stored in this repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
