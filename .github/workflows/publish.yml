name: Publish

# Releasing is documented in docs/releasing.md. In short: bump the version in
# pyproject.toml, update CHANGELOG.md, then publish a GitHub Release whose tag
# is `v<version>`.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: pipx run build

      - name: Check the metadata renders on PyPI
        run: pipx run twine check --strict dist/*

      - name: Refuse a release whose tag disagrees with the version
        # A mismatch here means the tag, the changelog and the artefact would
        # all disagree, and PyPI will not let the version be reused once it is
        # taken. Cheaper to fail now.
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::pyproject version ($version) does not match release tag ($tag)"
            exit 1
          fi
          echo "version $version matches tag $tag"

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/yesterdays-panoramax
    permissions:
      # Trusted Publishing: the OIDC token replaces a long-lived API token, so
      # no PyPI credential is ever stored in this repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/yesterdays-panoramax
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
